<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生产质量管理系统</title>
<style>
/* ===== 商务克制风格：白卡片+细边框+浅色图标块+低饱和点缀 ===== */
:root{
  --bg1:#eaf2fb; --bg2:#e6eff9;
  --accent:#2f9df4; --accent2:#57b8ff;
  --border:#e3edf8; --text:#1f2d3d; --text-sub:#8aa3c4;
  --ok:#2eb872; --warn:#e6a23c; --bad:#e05252;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
/* 登录 */
#login-view{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:200;background:linear-gradient(135deg,#eaf2fb,#dbe9f8)}
#login-card{width:400px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:36px 34px;box-shadow:0 10px 30px rgba(31,90,150,.12)}
#login-card .lg-ico{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#2f9df4,#57b8ff);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px}
#login-card h1{font-size:20px;text-align:center;margin-bottom:4px}
#login-card .lg-sub{font-size:12.5px;color:var(--text-sub);text-align:center;margin-bottom:22px}
#login-card input{width:100%;height:42px;border:1px solid #d6e4f3;border-radius:10px;padding:0 12px;font-size:14px;margin-bottom:12px;outline:none;background:#fbfdff}
#login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,157,244,.14);background:#fff}
#login-card .btn{width:100%;height:42px;border:none;border-radius:10px;background:linear-gradient(90deg,#2f9df4,#57b8ff);color:#fff;font-size:15px;cursor:pointer}
#login-card .btn:hover{filter:brightness(1.05)}
#login-card .lg-hint{margin-top:14px;font-size:12px;color:var(--text-sub);background:#f4f9fe;border:1px dashed #cfe3f7;border-radius:8px;padding:8px 12px;line-height:1.7}
#login-msg{color:var(--bad);font-size:13px;text-align:center;height:18px;margin-bottom:6px}
/* 顶部总导航 */
.topbar{display:flex;align-items:center;gap:12px;padding:0 18px;height:54px;background:linear-gradient(90deg,#2f9df4,#57b8ff);color:#fff;position:sticky;top:0;z-index:60}
.topbar .logo{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar .logo .ic{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px}
.top-link{color:#fff;text-decoration:none;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:14px;font-size:12.5px;cursor:pointer;border:none}
.top-link:hover{background:rgba(255,255,255,.32)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.top-right .u-chip{background:rgba(255,255,255,.16);padding:5px 14px;border-radius:16px;font-size:12.5px}
.btn-quit{background:rgba(255,255,255,.18);border:none;color:#fff;padding:5px 12px;border-radius:14px;cursor:pointer;font-size:12.5px}
/* 三段式主体 */
.layout{display:flex;min-height:calc(100vh - 54px)}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--border);padding:10px 8px;overflow-y:auto;flex-shrink:0}
.menu-group{padding:9px 12px;font-size:12.5px;color:var(--text-sub);cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-radius:8px;user-select:none}
.menu-group:hover{background:#f2f8fe;color:var(--accent)}
.menu-group .arrow{font-size:10px;transition:transform .2s}
.menu-group.open .arrow{transform:rotate(90deg)}
.group-items{display:none;margin:2px 0 6px}
.group-items.open{display:block}
.menu-item{padding:8px 12px 8px 26px;font-size:13px;border-radius:8px;cursor:pointer;color:#4a5a72;margin:1px 0}
.menu-item:hover{background:#f2f8fe;color:var(--accent)}
.menu-item.active{background:linear-gradient(90deg,#e3f2ff,#f0f8ff);color:var(--accent);font-weight:600}
.content{flex:1;padding:18px 22px;overflow-x:auto;min-width:0}
.page{display:none}
.page.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-title{font-size:18px;font-weight:700;margin-bottom:4px}
.page-desc{font-size:13px;color:var(--text-sub);margin-bottom:16px}
/* 卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(31,90,150,.05)}
.stat-card .lab{font-size:12.5px;color:var(--text-sub)}
.stat-card .val{font-size:24px;font-weight:700;margin:4px 0 2px}
.stat-card .val.blue{color:var(--accent)}
/* 面板/工具条 */
.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.searchbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.searchbar input,.searchbar select{height:32px;border:1px solid #d6e4f3;border-radius:8px;padding:0 10px;font-size:13px;min-width:140px;outline:none;background:#fff}
.searchbar input:focus,.searchbar select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,157,244,.14)}
.btn{border:none;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
.btn-p{background:linear-gradient(90deg,#2f9df4,#57b8ff);color:#fff}
.btn-p:hover{filter:brightness(1.05)}
.btn-o{background:#fff;border:1px solid #d6e4f3;color:#3d5a80}
.btn-o:hover{border-color:var(--accent);color:var(--accent)}
.btn-s{background:#e6f9f0;color:var(--ok);border:1px solid #bfe8d5}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:7px}
/* 表格 */
.tbl-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{background:#f7fafd;color:#5a7188;font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border)}
td{padding:8px 12px;border-bottom:1px solid #f0f5fa}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f7fbfe}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px}
.tag-blue{background:#e8f4ff;color:var(--accent)}
.tag-green{background:#e6f9f0;color:var(--ok)}
.tag-gray{background:#eef2f7;color:#7b8ca3}
.tag-red{background:#fdecef;color:var(--bad)}
/* 弹窗 */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(20,40,70,.4);z-index:100;align-items:center;justify-content:center}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:520px;max-width:94vw;max-height:88vh;overflow-y:auto;padding:20px}
.modal h3{font-size:15px;margin-bottom:14px}
.close-x{float:right;cursor:pointer;color:var(--text-sub);font-size:18px}
.form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field label{display:block;font-size:12px;color:var(--text-sub);margin-bottom:4px}
.field input,.field select{height:32px;border:1px solid #d6e4f3;border-radius:8px;padding:0 10px;font-size:13px;outline:none;background:#fff}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,157,244,.14)}
/* 提示 */
.alertbar{border-radius:10px;padding:9px 14px;font-size:13px;margin-bottom:12px}
.alert-ok{background:#e6f9f0;border:1px solid #bfe8d5;color:#1e7a4f}
.alert-bad{background:#fdecef;border:1px solid #f5c6cc;color:#b03434}
.hidden{display:none!important}
/* 权限/工序 chips 多选 */
.chip{display:inline-block;padding:4px 13px;border-radius:16px;border:1px solid #d6e4f3;cursor:pointer;font-size:12.5px;background:#fff;color:#4a5a72;user-select:none;transition:all .15s;margin:2px}
.chip:hover{border-color:var(--accent2)}
.chip.on{background:#e3f2ff;border-color:var(--accent);color:#1d6fb8;font-weight:600}
.chip input{display:none}
.perm-sec{border:1px dashed #d6e4f3;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fbfdff}
.perm-sec .ps-title{font-size:12.5px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.perm-sec .ps-desc{font-size:11.5px;color:var(--text-sub);font-weight:400;margin-left:auto}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cfe0f2;border-radius:4px}

/* 车间大屏（深色） */
.sc-wrap{background:#0b1c2c;border-radius:12px;padding:16px 18px;color:#e6f1fa;min-height:70vh}
.sc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:1px solid #1d3b57;padding-bottom:10px}
.sc-title{font-size:20px;font-weight:700;color:#eaf4ff;letter-spacing:1px}
.sc-time{font-size:12.5px;color:#7f9ab3}
.sc-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sc-card{background:linear-gradient(160deg,#12324d,#0e2740);border:1px solid #1d3b57;border-radius:10px;padding:12px 14px}
.sc-lb{font-size:12.5px;color:#9fb3c8}
.sc-v{font-size:26px;font-weight:700;margin-top:6px}
.sc-row2{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:12px}
@media(max-width:900px){.sc-row2{grid-template-columns:1fr}}
.sc-panel{background:#0e2740;border:1px solid #1d3b57;border-radius:10px;padding:12px 14px}
.sc-ph{font-size:13.5px;font-weight:600;color:#bfe0ff;margin-bottom:8px}
.sc-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.sc-tbl th{color:#8fb0cc;text-align:left;padding:6px 8px;border-bottom:1px solid #1d3b57;font-weight:600}
.sc-tbl td{padding:6px 8px;border-bottom:1px solid #15304a;color:#d7e6f4}

/* ═══════ 手机端适配（抽屉导航 + 底部 Tab）═══════ */
.menu-btn{display:none;background:none;border:none;font-size:20px;color:#3d5a7a;cursor:pointer;padding:2px 8px}
.mobile-tabbar{display:none}
.drawer-mask{display:none;position:fixed;inset:0;background:rgba(15,32,50,.4);z-index:55}
.drawer-mask.show{display:block}
@media (max-width: 840px){
  .topbar{padding:8px 10px;gap:6px}
  .topbar .logo{font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden}
  .topbar .logo .ic{font-size:15px}
  .top-link{display:none}               /* 手机上顶栏链接收起，功能进底部Tab/抽屉 */
  .top-right .u-chip{font-size:11.5px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu-btn{display:inline-block}
  .layout{display:block}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:238px;z-index:60;
           transform:translateX(-102%);transition:transform .24s ease;box-shadow:2px 0 14px rgba(15,40,70,.18);
           overflow-y:auto;padding-bottom:70px}
  .sidebar.open{transform:translateX(0)}
  .content{padding:10px 12px 74px}
  .page-title{font-size:17.5px}
  .page-desc{font-size:12px;line-height:1.55}
  .form-row{flex-wrap:wrap;gap:8px}
  .field{width:100%!important;min-width:0!important}
  .field label{font-size:12px}
  .field input,.field select,.field textarea{width:100%!important;min-width:0!important;box-sizing:border-box}
  .searchbar{flex-wrap:wrap;gap:6px}
  .searchbar input,.searchbar select{width:100%!important;min-width:0!important;box-sizing:border-box}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl-wrap table{font-size:12.5px;min-width:560px}   /* 表格可横向滑动 */
  .item-row{grid-template-columns:1fr!important;gap:6px!important;border-bottom:1px solid #eef4fa;padding:8px 0}
  .item-row input{width:100%!important}
  .btn{padding:7px 13px;font-size:13px}
  .btn-sm{padding:5px 10px;font-size:12px}
  #modal-box{width:94vw!important;max-width:94vw;max-height:88vh;overflow-y:auto;padding:14px 14px 20px}
  .kpi-card{min-width:calc(50% - 6px)!important;flex:1 1 calc(50% - 6px)}
  .sc-wrap{border-radius:8px;padding:10px 10px}
  .sc-title{font-size:16px}
  .sc-v{font-size:21px}
  .sc-tbl{font-size:11.5px}
  /* 底部 Tab 栏 */
  .mobile-tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:56px;z-index:52;
                 background:#fff;border-top:1px solid #e3ecf6;box-shadow:0 -2px 10px rgba(15,40,70,.06)}
  .mtb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:1px;font-size:10.5px;color:#7b8ca3;background:none;border:none;cursor:pointer;padding:0}
  .mtb .mi{font-size:19px;line-height:1.1}
  .mtb.on{color:var(--accent);font-weight:600}
}
/* 数据大屏（管理层） */
.bd-wrap{background:#0b1c2c;border-radius:12px;padding:16px 18px;color:#e6f1fa;min-height:72vh}
.bd-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.bd-c4{grid-column:span 4}.bd-c6{grid-column:span 6}.bd-c8{grid-column:span 8}.bd-c12{grid-column:span 12}
@media(max-width:1100px){.bd-c4,.bd-c6,.bd-c8{grid-column:span 12}}
@media(max-width:840px){.bd-wrap{padding:10px}.bd-grid{gap:9px}.bd-v{font-size:20px!important}}
.bd-card{background:linear-gradient(160deg,#12324d,#0e2740);border:1px solid #1d3b57;border-radius:10px;padding:12px 14px}
.bd-lb{font-size:12.5px;color:#9fb3c8}
.bd-v{font-size:26px;font-weight:700;margin-top:5px}
.bd-ph{font-size:13.5px;font-weight:600;color:#bfe0ff;margin-bottom:8px}
.bd-bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12.5px}
.bd-bar .nm{width:104px;color:#cfe3f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-bar .tr{flex:1;background:#12324d;height:12px;border-radius:6px;overflow:hidden}
.bd-bar .fl{height:100%;border-radius:6px}
.bd-bar .vv{width:60px;text-align:right;color:#9fb3c8}
</style>
</head>
<body>

<!-- ══════════ 登录 ══════════ -->
<div id="login-view">
  <div id="login-card">
    <div class="lg-ico">🏭</div>
    <h1>生产质量管理系统</h1>
    <div class="lg-sub">原料到货 → 过程检验 → 成品出厂，一条线管到底</div>
    <div id="login-msg"></div>
    <input id="login-user" placeholder="用户名" value="admin">
    <input id="login-pwd" type="password" placeholder="密码" value="123456" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">登 录</button>
    <div class="lg-hint">💡 演示账号：admin（管理员）/ qm（质量经理）/ qc（检验员）/ prodlead（班组长）/ buyer（采购）/ store（仓储），密码均 123456。不同角色看到的菜单不一样。</div>
  </div>
</div>

<!-- ══════════ 主界面 ══════════ -->
<div id="app-view" class="hidden">
  <div class="topbar">
    <button class="menu-btn" onclick="toggleDrawer()" title="菜单">☰</button>
    <div class="logo"><span class="ic">🏭</span>生产质量管理系统</div>
    <span class="top-link" onclick="showMobileQr()">📱 手机访问</span>
    <span class="top-link" onclick="openBoardPage()">📺 数据大屏</span>
    <span class="top-link" onclick="openPage('screen')">🖥️ 车间大屏</span>
    <div class="top-right">
      <span class="u-chip" id="u-chip"></span>
      <button class="btn-quit" onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="content">
      <!-- 各页面容器由 JS 动态渲染 -->
    </main>
  </div>
</div>

<div class="modal-mask" id="modal-mask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-box"></div>
</div>

<div id="toast" style="position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1f2d3d;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:300;display:none"></div>

<script>
/* ═══════════ 会话 ═══════════ */
const LS_KEY='qms_user'; const LS_VER=1;
let TOKEN=localStorage.getItem(LS_KEY+'_t')||'';
let ME=null, MENUS=[];

async function api(url,opt={}){
  opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});
  if(TOKEN)opt.headers['token']=TOKEN;
  const r=await fetch(url,opt);
  let d={}; try{d=await r.json()}catch(e){}
  if(r.status===401&&!url.includes('/login')){showLogin();throw new Error('登录过期')}
  if(!r.ok)throw new Error(d.detail||('请求失败 '+r.status));
  return d;
}
function qs(obj){return Object.keys(obj).filter(k=>obj[k]!==''&&obj[k]!=null).map(k=>k+'='+encodeURIComponent(obj[k])).join('&')}
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2600)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ═══════════ 登录/登出 ═══════════ */
async function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pwd').value;
  if(!u||!p){document.getElementById('login-msg').textContent='请输入用户名和密码';return}
  try{
    const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
    TOKEN=d.token; ME=d.user; MENUS=d.menus;
    localStorage.setItem(LS_KEY+'_t',TOKEN);
    localStorage.setItem(LS_KEY,JSON.stringify({user:ME,menus:MENUS,ver:LS_VER}));
    document.getElementById('login-msg').textContent='';
    enterApp();
  }catch(e){document.getElementById('login-msg').textContent=e.message}
}
function autoLogin(){
  const saved=JSON.parse(localStorage.getItem(LS_KEY)||'null');
  if(saved&&saved.ver===LS_VER&&localStorage.getItem(LS_KEY+'_t')){
    ME=saved.user; MENUS=saved.menus; TOKEN=localStorage.getItem(LS_KEY+'_t');
    enterApp(); return true;
  }
  return false;
}
function showLogin(){document.getElementById('app-view').classList.add('hidden');document.getElementById('login-view').style.display='flex'}
async function doLogout(){
  try{await api('/api/auth/logout',{method:'POST',body:'{}'})}catch(e){}
  TOKEN='';localStorage.removeItem(LS_KEY);localStorage.removeItem(LS_KEY+'_t');
  showLogin();
}
function enterApp(){
  document.getElementById('login-view').style.display='none';
  document.getElementById('app-view').classList.remove('hidden');
  document.getElementById('u-chip').textContent='👤 '+ME.real_name+' · '+roleName(ME.role);
  renderSidebar();
  renderMobileTabs();
  window.addEventListener('resize',()=>{renderMobileTabs();if(!isMobile())toggleDrawer(false)});
  openPage('dashboard');
}
function roleName(k){return {admin:'系统管理员',boss:'高层',qm:'质量经理',qc:'检验员',sampler:'取样员',prodlead:'班组长/主管',buyer:'采购',store:'仓储',worker:'操作工'}[k]||k}
function canManage(key){const m=MENUS.find(x=>x.key===key);return !!(m&&m.manage)}
function hasPage(key){return MENUS.some(x=>x.key===key)}

/* ═══════════ 侧边栏（分组折叠）═══════════ */
function renderSidebar(){
  const groups={};
  MENUS.forEach(m=>{ (groups[m.group]=groups[m.group]||[]).push(m); });
  const order=Object.keys(groups);
  let html='';
  order.forEach((g,gi)=>{
    const items=groups[g];
    html+='<div class="menu-group'+(gi===0?' open':'')+'" onclick="tg(this)"><span>'+g+'</span><span class="arrow">▶</span></div>';
    html+='<div class="group-items'+(gi===0?' open':'')+'">';
    items.forEach(m=>{html+='<div class="menu-item" data-p="'+m.key+'" onclick="openPage(\''+m.key+'\')">'+m.name+(m.manage?'':' <span class="tag tag-gray">读</span>')+'</div>'});
    html+='</div>';
  });
  document.getElementById('sidebar').innerHTML=html;
}
function tg(el){el.classList.toggle('open');const it=el.nextElementSibling;if(it)it.classList.toggle('open')}

/* ═══════════ 页面路由 ═══════════ */
function openPage(key){
  document.querySelectorAll('.menu-item').forEach(x=>x.classList.toggle('active',x.dataset.p===key));
  if(isMobile()){toggleDrawer(false);markMobileTab(key);}
  window.scrollTo({top:0,behavior:'instant'});
  const c=document.getElementById('content');
  const R={
    dashboard:()=>renderDashboard(),
    qcstandard:()=>renderStdPage(),
    incoming:()=>renderIncomingPage(),
    prodlot:()=>renderProdlotPage(),
    trace:()=>renderTracePage(),
    report:()=>renderReportPage(),
    screen:()=>renderScreenPage(),
    board:()=>renderBoardPage(),
    ncr:()=>renderNcrPage(),
    material:()=>renderEntityPage('material'),
    supplier:()=>renderEntityPage('supplier'),
    customer:()=>renderEntityPage('customer'),
    workshop:()=>renderEntityPage('workshop'),
    station:()=>renderStationPage(),
    team:()=>renderEntityPage('team'),
    department:()=>renderEntityPage('department'),
    position:()=>renderEntityPage('position'),
    duty:()=>renderDutyPage(),
    complaint:()=>renderComplaintPage(),
    audit:()=>renderAuditPage(),
    equipment:()=>renderEquipmentPage(),
    user:()=>renderUserPage(),
  };
  if(R[key]){c.innerHTML='';R[key]()}
}

function typeTag(t){const c={原料:'blue',辅料:'green',中间品:'gray',成品:'blue'}[t]||'gray';return '<span class="tag tag-'+c+'">'+t+'</span>'}
function opTd(entity,row,mgr){

  return '<td><button class="btn btn-o btn-sm" onclick="editRow(\''+entity+'\','+row.id+')">✏️ 编辑</button> '
    +'<button class="btn btn-o btn-sm" style="color:var(--bad);border-color:#f5c6cc" onclick="delRow(\''+entity+'\','+row.id+',\''+esc(row.name||row.code)+'\')">🗑 停用</button></td>';

async function loadEntity(entity){
  const kw=document.getElementById('kw-'+entity)?document.getElementById('kw-'+entity).value:'';
  const rows=await api('/api/'+entity+(kw?'?'+qs({keyword:kw}):''));
  const mgr=canManage(entity);
  document.getElementById('thead-'+entity).innerHTML='<tr>'+HEADERS[entity].map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  if(!rows.length){
    document.getElementById('tbody-'+entity).innerHTML='<tr><td colspan="9" style="text-align:center;color:var(--text-sub);padding:26px">暂无数据，点击右上角"新增"或使用 Excel 导入</td></tr>';
    return;
  }
  document.getElementById('tbody-'+entity).innerHTML=rows.map(r=>'<tr>'+rowHtml(entity,r,mgr)+'</tr>').join('');
}

function collectNew(entity){
  const g=id=>document.getElementById('new-'+id)?document.getElementById('new-'+id).value.trim():'';
  const m={
    material:()=>({code:g('code'),name:g('name'),material_type:g('type'),spec:g('spec'),unit:g('unit')}),
    supplier:()=>({code:g('code'),name:g('name'),contact:g('contact'),phone:g('phone')}),
    customer:()=>({code:g('code'),name:g('name'),contact:g('contact'),phone:g('phone')}),
    workshop:()=>({code:g('code'),name:g('name')}),
    team:()=>({name:g('name'),leader:g('leader')}),
    department:()=>({code:g('code'),name:g('name')}),
    position:()=>({code:g('code'),name:g('name')}),
  };
  return m[entity]?m[entity]():{};
}
async function addRow(entity){
  const data=collectNew(entity);
  if(!data.name){toast('请填写名称');return}
  if(data.code!==undefined&&!data.code){toast('请填写编码');return}
  try{
    await api('/api/'+entity,{method:'POST',body:JSON.stringify(data)});
    toast('✔ 已新增');
    document.getElementById('addbox-'+entity).style.display='none';
    ['code','name','contact','phone','spec','leader'].forEach(i=>{const el=document.getElementById('new-'+i);if(el)el.value=''});
    loadEntity(entity);
  }catch(e){toast('✘ '+e.message)}
}
async function editRow(entity,id){
  const rows=await api('/api/'+entity);
  const r=rows.find(x=>x.id===id);if(!r)return;
  const fields=editFields(entity,r);
  openModal('编辑 '+r.name||r.code,fields,(vals)=>{
    const body=vals;
    if(entity==='material'){body.material_type=r.material_type}
    return api('/api/'+entity+'/'+id,{method:'PUT',body:JSON.stringify(body)});
  },'保存修改');
}
function editFields(entity,r){
  const base=[
    {k:'code',label:'编码',v:r.code,w:120},{k:'name',label:'名称',v:r.name,w:180},
    {k:'remark',label:'备注',v:r.remark,w:200}];
  if(entity==='material')base.splice(2,0,{k:'spec',label:'规格',v:r.spec,w:180},{k:'unit',label:'单位',v:r.unit,w:60});
  if(entity==='supplier'||entity==='customer')base.splice(2,0,{k:'contact',label:'联系人',v:r.contact,w:100},{k:'phone',label:'电话',v:r.phone,w:150});
  if(entity==='team')base=[{k:'name',label:'班组名称',v:r.name,w:140},{k:'leader',label:'班组长',v:r.leader,w:100},{k:'remark',label:'备注',v:r.remark,w:200}];
  return base;
}
async function delRow(entity,id,name){
  if(!confirm('确定停用「'+name+'」？停用后列表不再显示。'))return;
  try{await api('/api/'+entity+'/'+id,{method:'DELETE'});toast('✔ 已停用');loadEntity(entity)}
  catch(e){toast('✘ '+e.message)}
}

/* ═══════════ Excel 导入 ═══════════ */
function downloadTpl(entity){
  if(!TOKEN){toast('请先登录');return}
  fetch('/api/templates/'+entity+'.csv',{headers:{token:TOKEN}}).then(r=>{
    if(!r.ok){toast('下载失败');return}
    r.blob().then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=entity+'_模板.csv';a.click()});
  });
}
function importFile(entity){
  const f=document.getElementById('file-'+entity);f.value='';f.click();
  f.onchange=async()=>{
    if(!f.files[0])return;
    const fd=new FormData();fd.append('file',f.files[0]);
    const r=await fetch('/api/import/'+entity,{method:'POST',headers:{token:TOKEN},body:fd});
    const d=await r.json();
    if(!r.ok){toast('✘ '+(d.detail||'导入失败'));return}
    let msg='✔ 导入完成：成功 '+d.inserted+' 行';
    if(d.duplicated)msg+=', 重复跳过 '+d.duplicated;
    if(d.error_count)msg+=', 失败 '+d.error_count+' 行';
    toast(msg);
    if(d.errors.length)alert('导入有 '+d.error_count+' 行失败：\n\n'+d.errors.join('\n'));
    loadEntity(entity);
  };
}

function pageChipsHtml(checkedSet,idPrefix){
  // 按分组排列页面 chips
  const groups={};
  PMATRIX.pages.forEach(p=>{(groups[p.group]=groups[p.group]||[]).push(p)});
  let html='';
  Object.keys(groups).forEach(g=>{
    html+='<div style="font-size:11.5px;color:var(--text-sub);margin:6px 0 2px">'+g+'</div>';
    groups[g].forEach(p=>{
      const on=checkedSet.has(p.key);
      html+='<span class="chip'+(on?' on':'')+'" data-id="'+p.key+'" onclick="chipToggle(\''+p.key+'\',this)">'+esc(p.name)+'<input type="checkbox"'+(on?' checked':'')+'></span>';
    });
  });
  return html;
}
function applyRoleTemplate(){
  applyRolePages();applyRoleManage();
}
function dutyDefaultByIds(deptId,posId){
  if(!window.DUTY)return null;
  const t=dutyTpl(deptId===''||deptId===null||deptId===undefined?null:Number(deptId),
                  posId===''||posId===null||posId===undefined?null:Number(posId));
  return t?{pages:t.view_pages,manage:t.manage_modules}:null;
}
function applyDutyTemplate(){
  const dEl=document.getElementById('uf-dept-id'), pEl=document.getElementById('uf-pos-id');
  const hint=document.getElementById('uf-perm-hint');
  if(!dEl||!pEl)return;
  const t=dutyDefaultByIds(dEl.value,pEl.value);
  const dName=(window.DUTY&&dEl.value)?(window.DUTY.departments.find(x=>Number(x.id)===Number(dEl.value))||{}).name:'';
  const pName=(window.DUTY&&pEl.value)?(window.DUTY.positions.find(x=>Number(x.id)===Number(pEl.value))||{}).name:'';
  if(t){
    document.getElementById('uf-pages').innerHTML=pageChipsHtml(new Set(t.pages));
    document.getElementById('uf-manage').innerHTML=pageChipsHtml(new Set(t.manage));
    if(hint)hint.innerHTML='权限来源：<span class="tag tag-green">🔐 岗位职责('+esc(dName+'·'+pName)+')</span> '
      +'<span style="color:var(--text-sub)">已自动套用；如与下面勾选不一致，则以勾选为准（变成账号微调）</span>';
  }else{
    applyRoleTemplate();
    if(hint)hint.innerHTML='权限来源：<span class="tag tag-gray">角色默认</span> '
      +((dEl.value&&pEl.value)?'<span style="color:var(--text-sub)">（该部门+职务还没配岗位职责，可到「岗位职责」页配）</span>':'');
  }
}
function applyRolePages(){

function applyRoleManage(){

async function editUser(id){
  const rows=await api('/api/admin/users');
  const r=rows.find(x=>x.id===id);if(!r)return;
  await getPMatrix();
  if(!window.ST_ALL)window.ST_ALL=await api('/api/station');
  userFormShell('✏️ 编辑账号 '+esc(r.username)+(r.perm_custom?' <span class="tag tag-warn">已自定义权限</span>':''),id);
  document.getElementById('uf-username').value=r.username;document.getElementById('uf-username').readOnly=true;
  document.getElementById('uf-name').value=r.real_name;
  if(document.getElementById('uf-dept-id'))document.getElementById('uf-dept-id').value=r.dept_id||'';
  if(document.getElementById('uf-pos-id'))document.getElementById('uf-pos-id').value=r.position_id||'';
  document.getElementById('uf-role').value=r.role;
  // 工序回填
  (r.station_ids||[]).forEach(sid=>{
    const chip=document.querySelector('#uf-stations .chip[data-id="'+sid+'"]');
    if(chip){chip.classList.add('on');chip.querySelector('input').checked=true}
  });
  // 权限回填：账号自定义 > 岗位职责 > 角色默认
  const _dd=dutyDefaultByIds(r.dept_id,r.position_id);
  const view= r.view_pages!==null&&r.view_pages!==undefined ? r.view_pages : (_dd?_dd.pages:roleDefault(r.role).pages);
  const mgr= r.manage_modules!==null&&r.manage_modules!==undefined ? r.manage_modules : (_dd?_dd.manage:roleDefault(r.role).manage);
  applyPermHintByIds(r.dept_id,r.position_id,r);
  document.getElementById('uf-pages').innerHTML=pageChipsHtml(new Set(view));
  document.getElementById('uf-manage').innerHTML=pageChipsHtml(new Set(mgr));
}
function applyPermHintByIds(deptId,posId,r){
  const hint=document.getElementById('uf-perm-hint');
  if(!hint)return;
  const dd=dutyDefaultByIds(deptId,posId);
  const dName=deptId?(window.DUTY.departments.find(x=>Number(x.id)===Number(deptId))||{}).name:'';
  const pName=posId?(window.DUTY.positions.find(x=>Number(x.id)===Number(posId))||{}).name:'';
  if(r&&r.perm_source==='account'){
    hint.innerHTML='权限来源：<span class="tag tag-warn">🎯 账号微调</span> '
      +'<span style="color:var(--text-sub)">该账号单独改过权限（优先于岗位职责）；点"套用岗位职责"可恢复</span>';
  }else if(dd){
    hint.innerHTML='权限来源：<span class="tag tag-green">🔐 岗位职责('+esc(dName+'·'+pName)+')</span> '
      +'<span style="color:var(--text-sub)">按部门+职务自动套用</span>';
  }else{
    hint.innerHTML='权限来源：<span class="tag tag-gray">角色默认</span>';
  }
}
async function saveUser(uid){
  const msg=document.getElementById('uf-msg');
  const username=document.getElementById('uf-username').value.trim();
  const name=document.getElementById('uf-name').value.trim();
  const deptIdEl=document.getElementById('uf-dept-id'), posIdEl=document.getElementById('uf-pos-id');
  const deptId=deptIdEl&&deptIdEl.value?Number(deptIdEl.value):null;
  const posId=posIdEl&&posIdEl.value?Number(posIdEl.value):null;
  const role=document.getElementById('uf-role').value;
  const stIds=collectIds('uf-stations').map(Number);
  const viewPages=collectIds('uf-pages');
  const manage=collectIds('uf-manage');
  if(!username||!name){msg.innerHTML='<div class="alertbar alert-bad">请填写用户名和姓名</div>';return}
  // 管理模块必须是可见页面的子集（防"看不见却可管"）
  const badManage=manage.filter(m=>!viewPages.includes(m));
  if(badManage.length){msg.innerHTML='<div class="alertbar alert-bad">"可管理"勾了看不到的页面：'+esc(badManage.join('、'))+'。请先在"能看哪些页面"里勾上，或取消管理勾选。</div>';return}
  // 与"岗位职责（或角色默认）"一致 → 存 null（继续保持按岗位/角色走，将来规则改了自动跟随）
  const dd=dutyDefaultByIds(deptId,posId);
  const def=dd||roleDefault(role);
  const sortEq=(a,b)=>JSON.stringify([...a].sort())===JSON.stringify([...b].sort());
  const viewCustom= !sortEq(viewPages,def.pages) ? viewPages : null;
  const mgrCustom= !sortEq(manage,def.manage) ? manage : null;
  const body={real_name:name,department:'',dept_id:deptId,position_id:posId,
    role_key:role,station_ids:stIds,view_pages:viewCustom,manage_modules:mgrCustom};
  try{
    if(uid===null){
      body.username=username;body.password=(document.getElementById('uf-pwd').value||'123456');
      await api('/api/admin/users',{method:'POST',body:JSON.stringify(body)});
      toast('✔ 已创建账号');
    }else{
      await api('/api/admin/users/'+uid,{method:'PUT',body:JSON.stringify(body)});
      toast('✔ 已保存（权限/工序已生效，该账号下次登录即按新权限）');
    }
    document.getElementById('addbox-user').style.display='none';
    loadUsers();
  }catch(e){msg.innerHTML='<div class="alertbar alert-bad">✘ '+esc(e.message)+'</div>'}
}

                     role:'<span class="tag tag-gray">角色默认</span>'}[r.perm_source]||'<span class="tag tag-gray">角色默认</span>');

async function resetPwd(id,uname){
  const p=prompt('为「'+uname+'」设置新密码（至少4位）：','123456');
  if(p===null)return;
  if(p.length<4){toast('密码至少 4 位');return}
  try{await api('/api/admin/users/'+id+'/password',{method:'PUT',body:JSON.stringify({password:p})});toast('✔ 密码已重置')}
  catch(e){toast('✘ '+e.message)}
}
async function toggleUser(id,uname,en){
  if(!en&&!confirm('停用账号「'+uname+'」？该账号将无法登录。'))return;
  try{await api('/api/admin/users/'+id,{method:'PUT',body:JSON.stringify({enabled:en})});toast(en?'✔ 已启用':'✔ 已停用');loadUsers()}
  catch(e){toast('✘ '+e.message)}
}

/* ═══════════ 通用弹窗 ═══════════ */
function openModal(title,fields,onSave,btnText,after){
  let html='<span class="close-x" onclick="closeModal()">✕</span><h3>'+title+'</h3>';
  fields.forEach(f=>{
    html+='<div class="field" style="margin-bottom:12px"><label>'+f.label+'</label>';
    if(f.select){
      html+='<select id="mf-'+f.k+'" style="width:100%;height:34px;border:1px solid #d6e4f3;border-radius:8px;padding:0 8px">';
      f.select.forEach(o=>{html+='<option value="'+o[f.sv]+'"'+(String(o[f.sv])===String(f.v)?' selected':'')+'>'+esc(o[f.st])+'</option>'});
      html+='</select>';
    }else{

function scAddBlank(){
  const box=document.getElementById('sc-items');
  const div=document.createElement('div');
  div.className='item-row';

  box.appendChild(div);

function itemRowHtml(it){
  it=it||{};
  const v=k=>it[k]!=null&&it[k]!==''?String(it[k]):'';
  return '<input placeholder="指标名（如 水分）" value="'+esc(v('indicator'))+'" style="width:100%">'
    +'<input placeholder="单位(%)" value="'+esc(v('unit'))+'" style="width:70px">'
    +'<input placeholder="≥下限" type="number" step="any" value="'+esc(v('min_val'))+'" style="width:80px">'
    +'<input placeholder="≤上限" type="number" step="any" value="'+esc(v('max_val'))+'" style="width:80px">'
    +'<span style="display:flex;gap:4px;align-items:center"><label style="font-size:11px;color:var(--text-sub);white-space:nowrap"><input type="checkbox" class="ik">关键</label>'
    +'<select class="cb" title="谁来测这个指标" style="height:26px;font-size:11.5px;border:1px solid #d6e4f3;border-radius:6px">'
    +'<option value="dept"'+(v('check_by')==='dept'||!v('check_by')?' selected':'')+'>🔬 质检部</option>'
    +'<option value="self"'+(v('check_by')==='self'?' selected':'')+'>🖐 车间自检</option></select>'
    +'<button class="btn btn-o btn-sm" onclick="this.closest(\'.item-row\').remove()">✕</button></span>';
}
function collectStdItems(containerId){
  const rows=document.querySelectorAll('#'+containerId+' .item-row');
  const items=[];
  rows.forEach(r=>{
    const inp=r.querySelectorAll('input');
    const indicator=inp[0].value.trim();
    if(!indicator)return;
    const cb=r.querySelector('.cb');
    items.push({indicator:indicator,unit:inp[1].value.trim(),
      min_val:inp[2].value===''?null:Number(inp[2].value),
      max_val:inp[3].value===''?null:Number(inp[3].value),
      check_by:cb?cb.value:'dept',
      is_key:r.querySelector('.ik').checked?1:0});
  });
  return items;
}
async function saveStdCreate(){
  const ctype=document.getElementById('sc-type').value;
  const objSel=document.getElementById('sc-obj');
  const otype=objSel.selectedOptions[0].dataset.type;
  const oid=objSel.value;
  const items=collectStdItems('sc-items');
  const msg=document.getElementById('sc-msg');
  if(!items.length){msg.innerHTML='<div class="alertbar alert-bad">请至少添加一个检验项目</div>';return}
  try{
    const r=await api('/api/qc-standards',{method:'POST',body:JSON.stringify({object_type:otype,object_id:Number(oid),check_type:ctype,items:items,sample_qty:1})});
    msg.innerHTML='<div class="alertbar alert-ok">✔ 已保存 '+r.std_no+'！检验时选到该对象会自动带出 '+items.length+' 项。</div>';
    loadStds();
  }catch(e){msg.innerHTML='<div class="alertbar alert-bad">✘ '+esc(e.message)+'</div>'}
}

    itemsHtml+='<div class="item-row" style="grid-template-columns:1.3fr 1.2fr .9fr 1fr">'
      +'<div><b>'+esc(it.indicator)+'</b>'+(it.is_key?' <span class="tag tag-warn" style="font-size:10px">关键</span>':'')+'</div>'

      +'<div><span class="res res-wait" id="judge-'+i+'">⏳</span></div></div>';
  });
  box.innerHTML='<span class="close-x" onclick="closeModal()">✕</span>'
    +'<h3>🧪 检验录入 · '+esc(lotNo)+'</h3>'
    +'<div style="font-size:12.5px;color:var(--text-sub);margin-bottom:10px">按标准 <b>'+esc(form.std_no+' '+form.std_name)+'</b> 自动带出 '+form.items.length+' 项。录入时实时判定，超限自动标红；提交后系统复核判定。</div>'
    +'<div id="test-items"></div>'
    +'<div style="text-align:right;margin-top:12px"><button class="btn btn-o" onclick="closeModal()">取消</button> '
    +'<button class="btn btn-p" onclick="submitTest('+lotId+','+form.std_id+')">✔ 提交检验</button></div>'
    +'<div id="test-msg" style="margin-top:10px"></div>';
  document.getElementById('test-items').innerHTML=itemsHtml;
  // 保存标准限值供前端实时判定
  window.__testForm=form;
  document.getElementById('modal-mask').classList.add('show');
}
function liveJudge(el,i){
  const it=window.__testForm.items[i];
  const res=document.getElementById('judge-'+i);
  const v=el.value.trim();
  if(v===''){res.className='res res-wait';res.textContent='⏳';return}
  if(it.min_val==null&&it.max_val==null){res.className='res res-pass';res.textContent='✔ 已填';return}
  const n=parseFloat(v);
  if(isNaN(n)){res.className='res res-fail';res.textContent='✘ 非数字';return}
  const ok=(it.min_val==null||n>=it.min_val)&&(it.max_val==null||n<=it.max_val);
  res.className=ok?'res res-pass':'res res-fail';
  res.textContent=ok?'✔ 合格':'✘ 超限';
}
async function submitTest(lotId,stdId){
  const rows=document.querySelectorAll('#test-items .item-row');
  const items=[];
  rows.forEach(r=>{
    const name=r.querySelector('b').textContent.replace('关键','').trim();
    const inp=r.querySelector('input');
    if(name&&inp.value.trim()!=='')items.push({indicator:name,actual:inp.value.trim()});
  });
  const msg=document.getElementById('test-msg');
  if(!items.length){msg.innerHTML='<div class="alertbar alert-bad">请至少录入一个实测值</div>';return}
  try{
    const r=await api('/api/incoming/'+lotId+'/test',{method:'POST',body:JSON.stringify({std_id:stdId,items:items})});
    if(r.result===1){
      msg.innerHTML='<div class="alertbar alert-ok">✔ 判定：<b>合格</b> —— 该批已放行，可用于投料。</div>';
      toast('✔ 检验合格，批次已放行');
    }else{
      msg.innerHTML='<div class="alertbar alert-bad">✘ 判定：<b>不合格</b> —— 批次已冻结，自动生成 <b>'+esc(r.ncr_no)+'</b>。<br><span style="font-size:12px">'+esc(r.fail_summary)+'</span></div>';
      toast('✘ 不合格，已开 NCR '+r.ncr_no);
    }
    setTimeout(()=>{closeModal();loadLots()},1800);
  }catch(e){msg.innerHTML='<div class="alertbar alert-bad">✘ '+esc(e.message)+'</div>'}
}

async function loadNcrs(){
  const st=document.getElementById('f-ncr-st')?document.getElementById('f-ncr-st').value:'';

  const rows=await api('/api/ncr?'+qs({status:st,keyword:kw}));

  const mine=ME.role;
  const canReject=['admin','qm','buyer'].includes(mine);

  tb.innerHTML=rows.map(r=>{
    let ops='';

      if(canReject)ops+='<button class="btn btn-o btn-sm" onclick="disposeNcr('+r.id+',\'reject\',\''+esc(r.ncr_no)+'\')">🚫 拒收退货</button> ';
      if(canApprove)ops+='<button class="btn btn-s btn-sm" onclick="disposeNcr('+r.id+',\'waive\',\''+esc(r.ncr_no)+'\')">🤝 让步接收</button> ';
      if(canApprove)ops+='<button class="btn btn-o btn-sm" style="color:var(--bad);border-color:#f5c6cc" onclick="disposeNcr('+r.id+',\'scrap\',\''+esc(r.ncr_no)+'\')">🗑 报废</button>';

async function disposeNcr(id,type,ncrNo){
  const names={reject:'拒收退货（退供应商）',waive:'让步接收（特批放行）',scrap:'报废处理'};
  if(type==='waive'&&!confirm('⚠️ 让步接收需质量经理审批。确认对该 NCR 让步接收？此操作将放行该批。'))return;
  if(type==='scrap'&&!confirm('确认报废该批？此操作不可逆。'))return;
  if(type==='reject'&&!confirm('确认拒收退货？该批将退回供应商。'))return;
  const remark=prompt('处置说明（'+names[type]+'）：',type==='reject'?'通知供应商退货处理':type==='waive'?'偏差在可接受范围，特批使用':'不合格报废');
  if(remark===null)return;
  try{
    await api('/api/ncr/'+id+'/dispose',{method:'POST',body:JSON.stringify({disposition:type,remark})});
    toast('✔ 已处置：'+names[type]);
    loadNcrs();loadLots();
  }catch(e){toast('✘ '+e.message)}
}

// ── 过程/成品检验录入（第二批：一张单分两块 自检 / 质检部）──
async function openProdTest(pid,lotNo,ctype){
  let form;
  try{form=await api('/api/production-lots/'+pid+'/test-form?check_type='+ctype)}
  catch(e){toast('✘ '+e.message);return}
  const title=ctype==='ipqc'?'🧪 过程检验':'🏅 成品检验';
  const box=document.getElementById('modal-box');
  form.items.forEach((it,i)=>{it.__i=i});
  const hasSelf=(form.self_count||0)>0, hasDept=(form.dept_count||0)>0;
  const block=(by,list,editable,label,tagcls,done)=>{
    if(!list.length)return '';
    let h='<div style="font-weight:600;margin:12px 0 4px;font-size:13px">'+label
      +' <span class="tag '+tagcls+'">'+list.length+' 项</span>'
      +(done?' <span class="tag tag-green">已录入</span>':'')
      +(editable?'':' <span class="tag tag-gray">只读</span>')+'</div>';
    list.forEach(it=>{
      const lim=(it.min_val!=null||it.max_val!=null)
        ?'<span style="color:var(--text-sub);font-size:11px">标准：'+(it.min_val!=null?'≥'+it.min_val:'')+(it.max_val!=null?' ≤'+it.max_val:'')+(it.unit?(' '+it.unit):'')+'</span>':'';
      h+='<div class="item-row" data-by="'+by+'" style="grid-template-columns:1.3fr 1.2fr .9fr 1fr">'
        +'<div><b>'+esc(it.indicator)+'</b>'+(it.is_key?' <span class="tag tag-warn" style="font-size:10px">关键</span>':'')+'</div>'
        +'<div style="font-size:12px;color:var(--text-sub)">'+lim+'<br>方法:'+esc(it.method||'—')+'</div>'
        +'<input data-i="'+it.__i+'" '+(editable?'':'disabled ')+'placeholder="实测值" oninput="liveJudge(this,'+it.__i+')" style="width:90px">'
        +'<div><span class="res res-wait" id="judge-'+it.__i+'">⏳</span></div></div>';
    });
    return h;
  };
  const selfItems=form.items.filter(x=>x.check_by==='self');
  const deptItems=form.items.filter(x=>x.check_by==='dept');
  let btns='<button class="btn btn-o" onclick="closeModal()">取消</button> ';
  if(hasSelf&&form.can_self&&!form.self_done)btns+='<button class="btn btn-p" onclick="submitProdTest('+pid+','+form.std_id+',\''+ctype+'\',\'self\')">✔ 提交车间自检</button> ';
  if(hasSelf&&form.self_done)btns+='<span class="tag tag-green" style="margin-left:6px">🖐 自检已录</span> ';
  if(hasDept&&form.can_dept&&!form.dept_done)btns+='<button class="btn btn-p" onclick="submitProdTest('+pid+','+form.std_id+',\''+ctype+'\',\'dept\')">✔ 提交质检部检测</button> ';
  if(hasDept&&form.dept_done)btns+='<span class="tag tag-green" style="margin-left:6px">🔬 质检已录</span> ';
  box.innerHTML='<span class="close-x" onclick="closeModal()">✕</span>'
    +'<h3>'+title+' · 批号 '+esc(lotNo)+'</h3>'
    +'<div style="font-size:12.5px;color:var(--text-sub);margin-bottom:4px">按标准 <b>'+esc(form.std_no+' '+form.std_name)+'</b> 自动带出 '+form.items.length+' 项。'
    +(hasSelf&&hasDept?'<b>自检合格即可先流转</b>；质检部结果若不合格，该批自动冻结并开不合格单。'
      :(hasDept?'该工序全部由质检部检测；不合格将冻结该批。':'该工序全部由车间自检；不合格将冻结该批。'))
    +(form.test_no?'<br>本单号：<b>'+esc(form.test_no)+'</b>':'')+'</div>'
    +'<div id="test-items">'
    +block('self',selfItems,form.can_self&&!form.self_done,'🖐 车间自检（车间现场录）','tag-blue',form.self_done)
    +block('dept',deptItems,form.can_dept&&!form.dept_done,'🔬 质检部检测（化验室录）','tag-green',form.dept_done)
    +'</div>'
    +'<div style="text-align:right;margin-top:12px">'+btns+'</div>'
    +'<div id="test-msg" style="margin-top:10px"></div>';
  window.__testForm=form;
  document.getElementById('modal-mask').classList.add('show');
}
async function submitProdTest(pid,stdId,ctype,stage){
  const rows=document.querySelectorAll('#test-items .item-row[data-by="'+stage+'"]');
  const items=[];
  rows.forEach(r=>{
    const name=r.querySelector('b').textContent.replace('关键','').trim();
    const inp=r.querySelector('input');
    if(name&&inp.value.trim()!=='')items.push({indicator:name,actual:inp.value.trim()});
  });
  const msg=document.getElementById('test-msg');
  if(!items.length){msg.innerHTML='<div class="alertbar alert-bad">请至少录入一个实测值</div>';return}
  const who=stage==='self'?'车间自检':'质检部检测';
  try{
    const r=await api('/api/production-lots/'+pid+'/test',{method:'POST',
      body:JSON.stringify({std_id:stdId,check_type:ctype,stage:stage,items:items})});
    if(r.result===2){
      msg.innerHTML='<div class="alertbar alert-bad">✘ '+who+'<b>不合格</b> —— 批次已冻结，自动生成 <b>'+esc(r.ncr_no)+'</b>，禁止流入下工序。<br><span style="font-size:12px">'+esc(r.fail_summary)+'</span></div>';
      toast('✘ 不合格，已冻结并开 NCR '+r.ncr_no);
    }else if(r.pending_dept===1){
      msg.innerHTML='<div class="alertbar alert-ok">✔ '+who+'<b>合格</b>，该批可先流入下工序；<b>质检部检测待录入</b>（质检不合格会自动冻结）。</div>';
      toast('✔ 自检合格（待质检确认）');
    }else if(r.result===1){
      msg.innerHTML=ctype==='oqc'
        ?'<div class="alertbar alert-ok">✔ 成品检验<b>合格</b> —— COA 报告已生成，该批可放行发货。</div>'
        :'<div class="alertbar alert-ok">✔ 检验<b>合格</b> —— 该批可流入下工序（下工序建批时可选它为父批）。</div>';
      toast('✔ 合格');
    }else{
      msg.innerHTML='<div class="alertbar alert-ok">✔ 已提交（'+who+'）</div>';
    }
    setTimeout(()=>{closeModal();loadProdlots()},2200);
  }catch(e){msg.innerHTML='<div class="alertbar alert-bad">✘ '+esc(e.message)+'</div>'}
}

  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();
}

async function renderTracePage(){
  const c=document.getElementById('content');
  const ttl=document.createElement('div');ttl.className='page-title';ttl.textContent='🔍 批次追溯';
  c.appendChild(ttl);
  const desc=document.createElement('div');desc.className='page-desc';
  desc.textContent='输入任意批号（成品批号 / 生产批号 / 来料批号），一键还原完整来龙去脉：原料 → 各工序（设备/班组/操作人）→ 检验数据 → 成品 COA；链上不合格处红字标源。';
  c.appendChild(desc);
  const bar=document.createElement('div');bar.className='panel';
  bar.innerHTML='<div class="searchbar">'
    +'<input id="trace-kw" placeholder="粘贴批号，如 20260910-ST08-EQ13-008-[HIS]-丙 或 20260910-RA-SUP01-001" style="flex:1;min-width:340px" onkeydown="if(event.key===\'Enter\')doTrace()">'
    +'<button class="btn btn-p" onclick="doTrace()">🔍 追溯</button>'
    +'<span style="font-size:12px;color:var(--text-sub)">💡 成品批号可在「生产批次」「成品报告」页复制</span></div>';
  c.appendChild(bar);
  const box=document.createElement('div');box.id='trace-box';
  c.appendChild(box);
  doTrace(true);
}
async function doTrace(silent){
  const box=document.getElementById('trace-box');
  const kw=document.getElementById('trace-kw').value.trim();
  if(!kw){ if(!silent) box.innerHTML='<div class="panel" style="text-align:center;color:var(--text-sub)">请输入批号</div>'; return }
  let d;
  try{d=await api('/api/trace?lot_no='+encodeURIComponent(kw))}
  catch(e){box.innerHTML='<div class="panel"><div class="alertbar alert-bad">✘ '+esc(e.message)+'</div></div>';return}
  const sum=d.summary;
  let html='<div class="panel" style="padding:12px 16px"><div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center">'
    +'<span style="font-size:14px;font-weight:600">批号 '+esc(d.lot_no)+'</span>'
    +'<span class="tag tag-blue">链路 '+sum.hops+' 级</span>'
    +'<span class="tag tag-gray">检验单 '+sum.tests+' 张</span>'
    +(sum.coa_no?'<span class="tag tag-green">'+esc(sum.coa_no)+'</span>':'')
    +(sum.has_problem?'<span class="tag tag-red">⚠ 链上发现不合格</span>':'<span class="tag tag-green">✔ 全程无不合格</span>')
    +'</div></div>';
  if(d.problems.length){
    html+='<div class="panel" style="border-left:4px solid var(--bad)"><div style="font-weight:600;color:var(--bad);margin-bottom:6px">⚠ 问题源头</div>'
      +d.problems.map(pb=>'<div style="font-size:13px;color:var(--bad)">· <b>'+esc(pb.lot_no)+'</b>（'+esc(pb.station_name)+'）：'+esc(pb.reason)+'</div>').join('')+'</div>';
  }
  html+='<div id="trace-chain"></div>';
  box.innerHTML=html;
  // 纵向时间线：从成品往上
  const nodes=d.chain.map((n,i)=>{
    const isRaw=n.kind==='incoming';
    const bad=[3,6].includes(n.status);
    const border=bad?'var(--bad)':(i===0?'var(--primary)':'#dfe8f3');
    let tests='';
    n.tests.forEach(t=>{
      const rows=t.items.map(it=>{
        let lim='';if(it.min_val!=null)lim+='≥'+it.min_val;if(it.max_val!=null)lim+=(lim?'/':'')+'≤'+it.max_val;
        return '<tr><td>'+esc(it.indicator)+'</td><td>'+(lim||'—')+'</td><td><b>'+esc(it.actual)+'</b> '+esc(it.unit||'')+'</td>'
          +'<td style="color:'+(it.pass===1?'var(--ok)':'var(--bad)')+';font-weight:600">'+(it.pass===1?'合格':(it.pass===0?'不合格':'未判'))+'</td></tr>';
      }).join('');
      tests+='<div style="margin-top:8px"><div style="font-size:12.5px;margin-bottom:4px">'
        +'<span class="tag '+(t.result===1?'tag-green':'tag-red')+'">'+esc(t.check_type_name)+'</span> '
        +'<b>'+esc(t.test_no)+'</b> <span style="color:var(--text-sub)">'+esc(t.std_name)+' · '+esc(t.tested_by)+' · '+esc(t.created_at)+'</span></div>'
        +'<div class="tbl-wrap"><table><thead><tr><th>项目</th><th>标准</th><th>实测</th><th>判定</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    });
    const ncrs=n.ncr&&n.ncr.length?'<div style="margin-top:8px;font-size:12.5px;color:var(--bad)">'
      +n.ncr.map(x=>'⚠ '+esc(x.ncr_no)+'（'+esc(x.status_name)+'）：'+esc(x.fail_summary)).join('<br>')+'</div>':'';
    const coa=n.coa_no?'<div style="margin-top:8px"><a class="btn btn-o btn-sm" href="/coa/'+esc(n.coa_no)+'" target="_blank">📄 查看 COA '+esc(n.coa_no)+'</a></div>':'';
    const meta=isRaw
      ? '<b>'+esc(n.material_name)+'</b> ｜ 供应商 '+esc(n.supplier_name)+'（批号 '+esc(n.supplier_lot||'—')+'）｜ '+n.qty+' '+esc(n.unit)+' ｜ 到货 '+esc(n.created_at)+' ｜ 登记 '+esc(n.arrival_by)
      : '<b>'+esc(n.station_code+' '+n.station_name)+'</b>（'+esc(n.equipment_name||'—')+'）｜ 班组 '+esc(n.team_name||'—')+' ｜ 操作 '+esc(n.operator)+' ｜ 产出 '+esc(n.material_name)+' ｜ '+n.qty+' '+esc(n.unit)+' ｜ '+esc(n.created_at);
    return '<div class="panel" style="border-left:4px solid '+border+';margin-left:'+(i*14)+'px">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'
      +'<div style="font-size:13.5px">'+(isRaw?'🚚 <b>原料</b>':'🏭 第 '+(d.chain.length-i)+' 道')+' <span class="tag tag-blue" style="font-size:11px">'+esc(n.lot_no)+'</span></div>'
      +'<span class="tag tag-'+(bad?'red':([2,5].includes(n.status)?'green':'warn'))+'">'+esc(n.status_name)+'</span></div>'
      +'<div style="font-size:12.5px;color:var(--text-sub);margin-top:6px">'+meta+'</div>'
      +tests+ncrs+coa+'</div>';
  }).join('');
  document.getElementById('trace-chain').innerHTML=nodes;
}

function svgPareto(data){
  const W=520,H=210,pad=34,bw=(W-pad*2)/Math.max(data.length,1);
  const max=Math.max(...data.map(d=>d.count),1), total=data.reduce((a,b)=>a+b.count,0);
  let bars='',line='',acc=0,cum=[];
  data.forEach((d,i)=>{
    const h=(H-pad*2)*d.count/max, x=pad+i*bw, y=H-pad-h;
    bars+='<rect x="'+(x+bw*0.15)+'" y="'+y+'" width="'+bw*0.7+'" height="'+h+'" fill="#4a90d9" rx="3"/>'
      +'<text x="'+(x+bw/2)+'" y="'+(y-4)+'" font-size="10" fill="#5a6b80" text-anchor="middle">'+d.count+'</text>'
      +'<text x="'+(x+bw/2)+'" y="'+(H-pad+13)+'" font-size="10" fill="#6b7c93" text-anchor="middle">'+esc(d.name.length>7?d.name.slice(0,6)+'…':d.name)+'</text>';
    acc+=d.count; cum.push([x+bw/2, H-pad-(H-pad*2)*(acc/total)]);
  });
  line=cum.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'
    +'<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#dfe8f3"/>'
    +bars+'<path d="'+line+'" fill="none" stroke="#e8894a" stroke-width="2"/>'
    +cum.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="#e8894a"/>').join('')
    +'<text x="'+(W-pad)+'" y="16" font-size="10" fill="#e8894a" text-anchor="end">— 累计占比（橙）</text>'
    +'</svg>';
}
function svgTrend(trend){
  const W=560,H=210,pad=30;
  const max=Math.max(1,...trend.map(d=>Math.max(d.iqc||0,d.ipqc||0,d.oqc||0)));
  const xs=i=>pad+(W-pad*2)*i/Math.max(trend.length-1,1);
  const ys=v=>H-pad-(H-pad*2)*v/max;
  const series=[['iqc','#4a90d9','来料'],['ipqc','#37a86b','过程'],['oqc','#e8894a','成品']];
  let path='';
  series.forEach(([k,col,name])=>{
    path+='<path d="'+trend.map((d,i)=>(i?'L':'M')+xs(i)+' '+ys(d[k]||0)).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2"/>';
    path+=trend.map((d,i)=>'<circle cx="'+xs(i)+'" cy="'+ys(d[k]||0)+'" r="2.2" fill="'+col+'"><title>'+esc(d.date)+' '+name+' '+((d[k]||0))+' 单</title></circle>').join('');
  });
  let labels='';
  trend.forEach((d,i)=>{ if(i%Math.ceil(trend.length/8)===0) labels+='<text x="'+xs(i)+'" y="'+(H-pad+13)+'" font-size="9.5" fill="#6b7c93" text-anchor="middle">'+esc(d.date)+'</text>' });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'
    +'<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#dfe8f3"/>'
    +'<line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(H-pad)+'" stroke="#dfe8f3"/>'
    +path+labels
    +'<g font-size="10">'+series.map(([k,col,name],j)=>'<rect x="'+(W-pad-64+0)+'" y="'+(12+j*14)+'" width="8" height="8" fill="'+col+'"/><text x="'+(W-pad-52)+'" y="'+(20+j*14)+'" fill="#6b7c93">'+name+'</text>').join('')+'</g>'
    +'</svg>';
}

      +ch.out_of_control.map(o=>'⚠ '+esc(o.date)+' <b>'+esc(o.label)+'</b> 实测 '+o.value+'（'+esc(o.side)+'）').join('<br>')+'</div>';
  }
}
function svgControl(ch,it){
  const pts=ch.points;
  const W=620,H=250,padL=46,padR=76,padT=18,padB=30;
  const vals=pts.map(p=>p.value);
  const cands=vals.concat([ch.ucl,ch.lcl].filter(v=>v!=null));
  if(ch.spec&&ch.spec.min_val!=null)cands.push(ch.spec.min_val);
  if(ch.spec&&ch.spec.max_val!=null)cands.push(ch.spec.max_val);
  let lo=Math.min(...cands),hi=Math.max(...cands);
  const spanM=(hi-lo)||Math.abs(hi)||1; lo-=spanM*0.12; hi+=spanM*0.12;
  const xs=i=>padL+(W-padL-padR)*i/Math.max(pts.length-1,1);
  const ys=v=>H-padB-(H-padB-padT)*(v-lo)/(hi-lo);
  const line=(v,col,dash,label)=>{
    if(v==null)return '';
    return '<line x1="'+padL+'" y1="'+ys(v)+'" x2="'+(W-padR)+'" y2="'+ys(v)+'" stroke="'+col+'" stroke-width="1.4" '+(dash?'stroke-dasharray="5 4"':'')+'/>'
      +'<text x="'+(W-padR+4)+'" y="'+(ys(v)+3.5)+'" font-size="10" fill="'+col+'">'+label+' '+v+'</text>';
  };
  let g='',sp='';
  for(let i=0;i<=4;i++){
    const v=lo+(hi-lo)*i/4;
    g+='<line x1="'+padL+'" y1="'+ys(v)+'" x2="'+(W-padR)+'" y2="'+ys(v)+'" stroke="#eef4fa"/>'
      +'<text x="'+(padL-6)+'" y="'+(ys(v)+3.5)+'" font-size="10" fill="#8595a8" text-anchor="end">'+v.toFixed(1)+'</text>';
  }
  const path=pts.map((p,i)=>(i?'L':'M')+xs(i)+' '+ys(p.value)).join(' ');
  pts.forEach((p,i)=>{
    sp+='<circle cx="'+xs(i)+'" cy="'+ys(p.value)+'" r="'+(p.oc?5:3.4)+'" fill="'+(p.oc?'#c92a3d':'#4a90d9')+'" stroke="#fff" stroke-width="1.4"><title>'+esc(p.date+' '+p.label)+'：'+p.value+'</title></circle>';
  });
  const specLines=(ch.spec&&ch.spec.min_val!=null?line(ch.spec.min_val,'#37a86b',true,'规格下限'):'')
    +(ch.spec&&ch.spec.max_val!=null?line(ch.spec.max_val,'#37a86b',true,'规格上限'):'');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;max-height:320px">'
    +g+specLines+line(ch.ucl,'#c92a3d',true,'UCL')+line(ch.lcl,'#c92a3d',true,'LCL')+line(ch.center,'#2f6fa8',false,'CL')
    +'<path d="'+path+'" fill="none" stroke="#9dc0e0" stroke-width="1.6"/>'+sp
    +'<text x="'+padL+'" y="'+(H-6)+'" font-size="10.5" fill="#6b7c93">'+esc(it.check_type_name+' · '+it.scope+' · '+it.indicator)+'（最近 '+pts.length+' 批，红点=超控制限）</text>'
    +'</svg>';
}

    +'<div class="bd-c4">'+card('区间综合合格率',k.range_rate==null?'—':k.range_rate+'%',(k.range_rate!=null&&k.range_rate<95)?'#ffab91':'#69f0ae')+'</div>'

    // NCR 趋势
    +'<div class="bd-card bd-c8"><div class="bd-ph">📉 不合格单(NCR) 趋势</div>'
      +(d.ncr_trend.length?'<svg viewBox="0 0 560 150" style="width:100%;height:auto">'
        +d.ncr_trend.map((x,i)=>{

/* ═══════════ 岗位职责（分权责：部门 + 职务 → 模块权限）═══════════ */
let DUTY=null, DUTY_DEPT='all';
async function renderDutyPage(){
  DUTY=await api('/api/duty-matrix');
  window.DUTY=DUTY;
  const body='<div class="panel"><div class="searchbar">'
    +'<span style="font-size:13px">按部门查看：</span>'
    +'<select id="duty-dept" onchange="DUTY_DEPT=this.value;renderDutyRows()" style="min-width:150px">'
    +'<option value="all">全部部门</option><option value="none">通用职务（兜底）</option>'
    +DUTY.departments.map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join('')+'</select>'
    +'<span style="font-size:12px;color:var(--text-sub)">改完即生效：新建/编辑账号选好"部门+职务"就自动套用这里的模块权限</span></div></div>'
    +'<div class="panel" style="font-size:12.5px">'
    +'🔎 <b>权限怎么算</b>：账号单独微调 &gt; <b>岗位职责（本页）</b> &gt; 角色默认模板。'
    +'本页按"部门 + 职务"定规则，是日常维护权限的主入口。</div>'
    +'<div class="tbl-wrap"><table><thead><tr><th>职务</th><th>部门</th><th>可见模块</th><th>可管模块</th><th>最近修改</th><th>操作</th></tr></thead>'
    +'<tbody id="duty-body"></tbody></table></div>';
  document.getElementById('content').innerHTML=pageShell('🔐 岗位职责',
    '把"什么岗位管什么事"定成规则：每个部门下的每个职务，勾选它能看/能管的模块。',body);
  renderDutyRows();
}
function dutyTpl(deptId,posId){
  if(!DUTY)return null;
  const same=(a,b)=>(a===null||a===undefined?null:Number(a))===(b===null||b===undefined?null:Number(b));
  let t=DUTY.templates.find(x=>same(x.dept_id,deptId)&&same(x.position_id,posId));
  if(!t&&deptId!==null&&deptId!==undefined)t=DUTY.templates.find(x=>(x.dept_id===null||x.dept_id===undefined)&&same(x.position_id,posId));
  return t||null;
}
function dutyRowsData(){
  const rows=[];
  const depts=DUTY.departments;
  DUTY.positions.forEach(p=>{
    if(DUTY_DEPT==='all'){
      const own=depts.map(d=>({dept:d,tpl:DUTY.templates.find(x=>Number(x.dept_id)===Number(d.id)&&Number(x.position_id)===Number(p.id))})).filter(x=>x.tpl);
      const gen=DUTY.templates.find(x=>(x.dept_id===null||x.dept_id===undefined)&&Number(x.position_id)===Number(p.id));
      if(own.length)own.forEach(x=>rows.push({pos:p,dept:x.dept,tpl:x.tpl}));
      else if(gen)rows.push({pos:p,dept:null,tpl:gen});
    } else if(DUTY_DEPT==='none'){
      const gen=DUTY.templates.find(x=>(x.dept_id===null||x.dept_id===undefined)&&Number(x.position_id)===Number(p.id));
      rows.push({pos:p,dept:null,tpl:gen||null});
    } else {
      const d=depts.find(x=>Number(x.id)===Number(DUTY_DEPT));
      if(!d)return;
      rows.push({pos:p,dept:d,tpl:DUTY.templates.find(x=>Number(x.dept_id)===Number(d.id)&&Number(x.position_id)===Number(p.id))||null});
    }
  });
  return rows;
}
function renderDutyRows(){
  const tbody=document.getElementById('duty-body');
  if(!tbody)return;
  const rows=dutyRowsData();
  if(!rows.length){tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--text-sub);padding:24px">该部门下暂无可配置职务</td></tr>';return}
  tbody.innerHTML=rows.map(r=>{
    const t=r.tpl;
    const deptTxt=r.dept?esc(r.dept.name):'<span class="tag tag-gray">通用职务</span>';
    const viewTxt=t?t.view_pages.length+' 个':'<span class="tag tag-warn">未配置</span>';
    const mgrTxt=t?t.manage_modules.length+' 个':'—';
    const who=t?'<span style="font-size:12px;color:var(--text-sub)">'+esc(t.updated_by)+' · '+esc(t.updated_at)+'</span>':'<span style="font-size:12px;color:var(--text-sub)">回落到角色默认模板</span>';
    const did=r.dept?r.dept.id:'null';
    return '<tr><td><b>'+esc(r.pos.name)+'</b><br><span style="font-size:11.5px;color:var(--text-sub)">'+esc(r.pos.code)+'</span></td>'
      +'<td>'+deptTxt+'</td><td>'+viewTxt+'</td><td>'+mgrTxt+'</td><td>'+who+'</td>'
      +'<td><button class="btn btn-o btn-sm" onclick="dutyEdit('+r.pos.id+','+did+')">✏️ 配置</button>'
      +(t?' <button class="btn btn-o btn-sm" style="color:var(--bad);border-color:#f5c6cc" onclick="dutyDel('+t.id+',\''+esc(r.pos.name)+'\')">🗑 停用</button>':'')
      +'</td></tr>';
  }).join('');
}
function dutyEdit(posId,deptId){
  const pos=(DUTY.positions.find(x=>Number(x.id)===Number(posId))||{});
  const dept=deptId===null?null:DUTY.departments.find(x=>Number(x.id)===Number(deptId));
  const t=dutyTpl(deptId,posId);
  window.DUTY_EDIT={posId:posId,deptId:deptId};
  const curPageSet=new Set(t?t.view_pages:[]);
  const curMgrSet=new Set(t?t.manage_modules:[]);
  const box=document.getElementById('modal-box');
  box.innerHTML='<span class="close-x" onclick="closeModal()">✕</span>'
    +'<h3>配置岗位职责：'+esc(dept?dept.name+' · ':'通用职务 · ')+esc(pos.name||'')+'</h3>'
    +'<div style="font-size:12.5px;color:var(--text-sub);margin-bottom:10px">勾选这个岗位能看/能管的模块。'
    +(t?'':' 该岗位当前<b>未配置</b>，保存后即以本页规则为准。')+'</div>'
    +'<div class="perm-sec"><div class="ps-title">👁 能看哪些模块'
    +'<button class="btn btn-o btn-sm" onclick="dutyFillFrom(\'pages\',\''+esc(pos.code||'')+'\')">套用同类岗位（参考）</button>'
    +'<span class="ps-desc">至少勾一个</span></div><div id="duty-pages">'+pageChipsHtml(curPageSet)+'</div></div>'
    +'<div class="perm-sec"><div class="ps-title">🛠️ 能管理（增删改）哪些模块'
    +'<span class="ps-desc">必须是"能看"的子集</span></div><div id="duty-manage">'+pageChipsHtml(curMgrSet)+'</div></div>'
    +'<div style="text-align:right"><button class="btn btn-o" onclick="closeModal()">取消</button> '
    +'<button class="btn btn-p" onclick="dutySave('+posId+','+(deptId===null?'null':deptId)+')">✔ 保存岗位职责</button></div>'
    +'<div id="duty-msg"></div>';
  document.getElementById('modal-mask').classList.add('show');
}
function dutyFillFrom(kind,posCode){
  // 参考"同名职务在其它部门/通用职务"的配置，快速铺一遍（排除正在编辑的这条）
  const cur=window.DUTY_EDIT||{};
  const same=(a,b)=>(a===null||a===undefined?null:Number(a))===(b===null||b===undefined?null:Number(b));
  const posId=(DUTY.positions.find(p=>p.code===posCode)||{}).id;
  const peer=DUTY.templates.find(x=>Number(x.position_id)===Number(posId)
    && !(same(x.dept_id,cur.deptId))
    && (x.view_pages||[]).length);
  if(!peer){toast('没有可参考的同类岗位配置，请直接勾选');return}
  if(kind==='pages')document.getElementById('duty-pages').innerHTML=pageChipsHtml(new Set(peer.view_pages));
  else document.getElementById('duty-manage').innerHTML=pageChipsHtml(new Set(peer.manage_modules));
}
async function dutySave(posId,deptId){
  const msg=document.getElementById('duty-msg');
  const pages=collectIds('duty-pages');
  const mgs=collectIds('duty-manage');
  if(!pages.length){msg.innerHTML='<div class="alertbar alert-bad">至少要勾一个"能看"的模块</div>';return}
  const bad=mgs.filter(m=>!pages.includes(m));
  if(bad.length){
    msg.innerHTML='<div class="alertbar alert-bad">"能管理"里有看不到的模块：'+esc(bad.join('、'))+'，请先勾上可见或取消管理</div>';return;
  }
  try{
    await api('/api/duty-templates',{method:'POST',body:JSON.stringify({
      dept_id:deptId,position_id:posId,view_pages:pages,manage_modules:mgs})});
    closeModal();
    toast('✔ 岗位职责已保存，相关账号下次登录即按新规则');
    DUTY=await api('/api/duty-matrix');window.DUTY=DUTY;
    renderDutyRows();
  }catch(e){msg.innerHTML='<div class="alertbar alert-bad">✘ '+esc(e.message)+'</div>'}
}
async function dutyDel(tid,name){
  if(!confirm('停用「'+name+'」的这条岗位职责？停用后该岗位将回落到角色默认模板。'))return;
  try{await api('/api/duty-templates/'+tid,{method:'DELETE'});toast('✔ 已停用');
    DUTY=await api('/api/duty-matrix');window.DUTY=DUTY;renderDutyRows()}
  catch(e){toast('✘ '+e.message)}
}

const CP_ST={0:'待受理',1:'调查中',2:'已回复',3:'已关闭'};
const CP_TAG={0:'warn',1:'blue',2:'green',3:'gray'};
const CP_TYPES=['质量异议','包装标识','交期','其他'];
const CP_SEV={1:'一般',2:'严重',3:'重大'};

    const btn=document.createElement('button');btn.className='btn btn-p';btn.style.cssText='float:right;margin-top:2px';
    btn.textContent='+ 登记客诉';btn.onclick=()=>showComplaintForm();

    const tag=document.createElement('span');tag.className='tag tag-gray';tag.style.cssText='float:right;margin-top:6px';tag.textContent='只读';

  }
  c.appendChild(desc);

  bar.innerHTML='<div class="searchbar">'
    +'<select id="cp-st" style="min-width:120px" onchange="loadComplaints()"><option value="">全部状态</option>'
    +Object.keys(CP_ST).map(k=>'<option value="'+k+'">'+CP_ST[k]+'</option>').join('')+'</select>'
    +'<input id="cp-kw" placeholder="搜客诉号/主题/批号/内容" style="flex:1;min-width:200px" onkeydown="if(event.key===\'Enter\')loadComplaints()">'
    +'<button class="btn btn-o" onclick="loadComplaints()">🔍 查询</button></div>';
  c.appendChild(bar);

  c.appendChild(tbl);

async function loadComplaints(){
  const st=document.getElementById('cp-st')?document.getElementById('cp-st').value:'';
  const kw=document.getElementById('cp-kw')?document.getElementById('cp-kw').value:'';

      +'<td style="font-size:12.5px">'+esc(r.claim_type)+'</td><td>'+sevTag+'</td>'
      +'<td style="font-size:12.5px">'+esc(r.title)+'</td>'
      +'<td><span class="tag tag-'+CP_TAG[r.status]+'">'+esc(r.status_name)+'</span></td>'
      +'<td style="font-size:11.5px;color:var(--text-sub)">'+esc(r.created_by)+'<br>'+esc(r.created_at)+'</td>'

    +'<div class="field"><label>客户</label><select id="cp-cus" style="min-width:170px"><option value="">（可留空）</option>'
    +cus.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div>'
    +'<div class="field"><label>关联批号（可留空）</label><input id="cp-lot" placeholder="成品批号" style="width:210px"></div>'
    +'<div class="field"><label>类型</label><select id="cp-type">'+CP_TYPES.map(t=>'<option>'+t+'</option>').join('')+'</select></div>'
    +'<div class="field"><label>严重程度</label><select id="cp-sev">'
    +'<option value="1">1 一般</option><option value="2">2 严重（影响使用）</option><option value="3">3 重大（停产/退货/索赔）</option></select></div>'
    +'</div><div class="form-row">'
    +'<div class="field" style="flex:1"><label>主题</label><input id="cp-title" placeholder="一句话说清问题" style="width:100%"></div></div>'
    +'<div class="field" style="margin-top:6px"><label>客户反映内容</label><textarea id="cp-content" rows="3" style="width:100%;border:1px solid #d6e4f3;border-radius:8px;padding:8px"></textarea></div>'
    +'<div style="text-align:right;margin-top:8px"><button class="btn btn-o" onclick="document.getElementById(\'addbox-cp\').style.display=\'none\'">收起</button> '
    +'<button class="btn btn-p" onclick="saveComplaint()">✔ 登记</button></div><div id="cp-msg"></div>';
}
async function saveComplaint(){
  const msg=document.getElementById('cp-msg');
  const title=document.getElementById('cp-title').value.trim();
  if(!title){msg.innerHTML='<div class="alertbar alert-bad">请填写主题</div>';return}
  try{
    const r=await api('/api/complaints',{method:'POST',body:JSON.stringify({
      customer_id:Number(document.getElementById('cp-cus').value)||null,
      lot_no:document.getElementById('cp-lot').value.trim(),
      claim_type:document.getElementById('cp-type').value,
      severity:Number(document.getElementById('cp-sev').value),
      title:title,
      content:document.getElementById('cp-content').value.trim()})});
    toast('✔ 已登记 '+r.complaint_no);
    document.getElementById('addbox-cp').style.display='none';
    loadComplaints();
  }catch(e){msg.innerHTML='<div class="alertbar alert-bad">✘ '+esc(e.message)+'</div>'}
}
async function showComplaint(id){
  const d=await api('/api/complaints'+(document.getElementById('cp-kw').value?('?keyword='+encodeURIComponent(document.getElementById('cp-kw').value)):''));
  const r=d.rows.find(x=>x.id===id);if(!r)return;
  const canDeal=['admin','qm'].includes(ME.role);
  const field=(label,val,cls)=>'<div style="font-size:12.5px;margin:6px 0"><span style="color:var(--text-sub)">'+label+'</span><br><span class="'+cls+'">'+esc(val||'—')+'</span></div>';
  const box=document.getElementById('modal-box');
  box.innerHTML='<span class="close-x" onclick="closeModal()">✕</span>'
    +'<h3>📣 '+esc(r.complaint_no)+' <span class="tag tag-'+CP_TAG[r.status]+'">'+esc(r.status_name)+'</span></h3>'
    +'<div style="font-size:12.5px;color:var(--text-sub);margin-bottom:6px">'+esc(r.customer_name||'未指定客户')+' · '+esc(r.claim_type)+' · 严重程度 '+esc(r.severity_name)
    +' · 登记 '+esc(r.created_by)+' '+esc(r.created_at)+'</div>'
    +'<div class="panel" style="margin-bottom:10px">'
    +field('主题','<b>'+esc(r.title)+'</b>')
    +field('客户反映',r.content)
    +(r.lot_no?'<div style="font-size:12.5px;margin:6px 0"><span style="color:var(--text-sub)">关联批次</span><br>'
      +'<span class="tag tag-blue">'+esc(r.lot_no)+'</span> '+(r.coa_no?'<span class="tag tag-green">'+esc(r.coa_no)+'</span>':'')
      +' <button class="btn btn-o btn-sm" onclick="closeModal();gotoTrace(\''+esc(r.lot_no)+'\')">🔍 查该批追溯</button></div>':'')
    +'</div>'
    +(canDeal?'<div class="perm-sec"><div class="ps-title">🛠 调查与处置（质量经理/管理员）</div>'
      +'<div class="field" style="margin-bottom:6px"><label>原因分析</label><textarea id="cp-rc" rows="2" style="width:100%;border:1px solid #d6e4f3;border-radius:8px;padding:8px">'+esc(r.root_cause)+'</textarea></div>'
      +'<div class="field" style="margin-bottom:6px"><label>纠正/预防措施</label><textarea id="cp-act" rows="2" style="width:100%;border:1px solid #d6e4f3;border-radius:8px;padding:8px">'+esc(r.action)+'</textarea></div>'
      +'<div class="field" style="margin-bottom:6px"><label>回复客户内容</label><textarea id="cp-rep" rows="2" style="width:100%;border:1px solid #d6e4f3;border-radius:8px;padding:8px">'+esc(r.reply)+'</textarea></div>'
      +'<div class="field"><label>状态</label><select id="cp-st2">'
      +Object.keys(CP_ST).map(k=>'<option value="'+k+'"'+(Number(k)===r.status?' selected':'')+'>'+CP_ST[k]+'</option>').join('')+'</select>'
      +'<span style="font-size:11.5px;color:var(--text-sub);margin-left:8px">关闭前必须填原因分析+措施+回复</span></div>'
      +'<div style="text-align:right;margin-top:10px"><button class="btn btn-o" onclick="closeModal()">取消</button> '
      +'<button class="btn btn-p" onclick="saveComplaintDeal('+id+')">✔ 保存处置</button></div><div id="cp-dmsg"></div></div>'
      :'<div class="panel" style="font-size:12.5px">'
      +field('原因分析',r.root_cause)+field('纠正措施',r.action)+field('回复客户',r.reply)
      +(r.handled_by?'<div style="font-size:12px;color:var(--text-sub)">处置人 '+esc(r.handled_by)+' '+esc(r.handled_at)+'</div>':'')
      +(r.closed_by?'<div style="font-size:12px;color:var(--text-sub)">关闭人 '+esc(r.closed_by)+' '+esc(r.closed_at)+'</div>':'')+'</div>');
  document.getElementById('modal-mask').classList.add('show');
}
async function saveComplaintDeal(id){
  const msg=document.getElementById('cp-dmsg');
  try{
    await api('/api/complaints/'+id,{method:'PUT',body:JSON.stringify({
      root_cause:document.getElementById('cp-rc').value.trim(),
      action:document.getElementById('cp-act').value.trim(),
      reply:document.getElementById('cp-rep').value.trim(),
      status:Number(document.getElementById('cp-st2').value)})});
    toast('✔ 处置已保存');
    closeModal();loadComplaints();
  }catch(e){msg.innerHTML='<div class="alertbar alert-bad">✘ '+esc(e.message)+'</div>'}
}

/* ═══════════ 操作日志（第三批，仅管理员）═══════════ */
const ACT_NAMES={create:'新增',update:'修改',delete:'停用',import:'导入',login:'登录',logout:'退出'};
async function renderAuditPage(){
  const c=document.getElementById('content');
  const ttl=document.createElement('div');ttl.className='page-title';ttl.textContent='📜 操作日志';
  const desc=document.createElement('div');desc.className='page-desc';
  desc.textContent='谁在什么时候改了什么（标准、判定、账号、职责、客诉…全部留痕）。排查"数据怎么变了"就查这里。';
  c.appendChild(ttl);c.appendChild(desc);
  const bar=document.createElement('div');bar.className='panel';
  bar.innerHTML='<div class="searchbar">'
    +'<select id="au-days" style="min-width:110px"><option value="7">近 7 天</option><option value="30" selected>近 30 天</option><option value="90">近 90 天</option><option value="365">近 1 年</option></select>'
    +'<select id="au-user" style="min-width:120px"><option value="">全部用户</option></select>'
    +'<select id="au-act" style="min-width:110px"><option value="">全部动作</option></select>'
    +'<input id="au-kw" placeholder="搜对象/详情（如 user:qc、STD-001）" style="flex:1;min-width:200px" onkeydown="if(event.key===\'Enter\')loadAudit()">'
    +'<button class="btn btn-o" onclick="loadAudit()">🔍 查询</button></div>';
  c.appendChild(bar);
  const tbl=document.createElement('div');tbl.className='tbl-wrap';
  tbl.innerHTML='<table><thead><tr><th>时间</th><th>用户</th><th>动作</th><th>对象</th><th>详情</th></tr></thead><tbody id="tbody-au"></tbody></table></div>';
  c.appendChild(tbl);
  loadAudit(true);
}
async function loadAudit(fillOpts){
  const days=document.getElementById('au-days').value;
  const un=document.getElementById('au-user').value;
  const ac=document.getElementById('au-act').value;
  const kw=document.getElementById('au-kw').value;
  const d=await api('/api/audit-logs?'+qs({days:days,username:un,action:ac,keyword:kw}));
  if(fillOpts){
    document.getElementById('au-user').innerHTML='<option value="">全部用户</option>'+d.users.map(u=>'<option value="'+esc(u)+'">'+esc(u)+'</option>').join('');
    document.getElementById('au-act').innerHTML='<option value="">全部动作</option>'+d.actions.map(a=>'<option value="'+esc(a)+'">'+esc(ACT_NAMES[a]||a)+'</option>').join('');
  }
  const tb=document.getElementById('tbody-au');
  if(!d.rows.length){tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--text-sub);padding:24px">该条件下暂无日志</td></tr>';return}
  tb.innerHTML=d.rows.map(r=>'<tr><td style="font-size:12px;color:var(--text-sub)">'+esc(r.created_at)+'</td>'
    +'<td><b>'+esc(r.username)+'</b></td>'
    +'<td><span class="tag tag-blue">'+esc(ACT_NAMES[r.action]||r.action)+'</span></td>'
    +'<td style="font-size:12.5px">'+esc(r.target)+'</td>'
    +'<td style="font-size:12.5px;color:var(--text-sub)">'+esc(r.detail)+'</td></tr>').join('');
}


/* ═══════════ 我的工作台（按角色划分业务，第六批）═══════════ */
function wbCss(){
  if(document.getElementById('wb-css'))return;
  const st=document.createElement('style');st.id='wb-css';
  st.textContent='.wb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}'
   +'.wb-card{background:#fff;border:1px solid #e3ecf6;border-radius:10px;padding:12px;cursor:pointer;transition:.15s}'
   +'.wb-card:hover{border-color:#9cc4ee;box-shadow:0 2px 10px rgba(60,120,200,.12);transform:translateY(-1px)}'
   +'.wb-n{font-size:24px;font-weight:700;color:var(--pri,#2b6cb0);line-height:1.1}'
   +'.wb-t{font-size:13px;font-weight:600;margin-top:2px;color:#2b3b52}'
   +'.wb-h{font-size:11px;color:var(--text-sub,#8595a8);margin-top:4px}'
   +'.wb-empty{border-style:dashed;cursor:default}'
   +'.wb-empty:hover{transform:none;box-shadow:none;border-color:#e3ecf6}'
   +'@media (max-width:840px){.wb-grid{grid-template-columns:repeat(2,1fr);gap:8px}.wb-card{padding:10px}.wb-n{font-size:20px}}';
  document.head.appendChild(st);
}
async function loadWorkbench(force){
  if(window.__wb!==undefined && !force)return window.__wb;
  try{window.__wb=await api('/api/workbench')}catch(e){window.__wb=null}
  return window.__wb;
}
async function fillWorkbench(){
  const box=document.getElementById('wb-box');if(!box)return;
  wbCss();
  const wb=await loadWorkbench(true);
  if(!wb){box.innerHTML='<div class="panel" style="font-size:12.5px;color:var(--text-sub)">工作台数据暂不可用</div>';return}
  const info='<div style="font-size:12.5px;color:var(--text-sub);margin:2px 0 10px">'
   +'<b>'+esc(wb.real_name)+'</b> · '+esc(wb.dept_name||'—')+(wb.position_name?(' · '+esc(wb.position_name)):'')
   +'　<span class="tag tag-blue">'+esc(wb.role_name)+'</span>'
   +(wb.stations&&wb.stations.length?'<br>负责工序：'+wb.stations.map(x=>esc(x)).join('、'):'')
   +(wb.total_open?('　待办合计 <b>'+wb.total_open+'</b> 项'):'')+'</div>';
  const cards=(wb.todos||[]).map(t=>'<div class="wb-card" onclick="openPage(\''+t.page+'\')">'
   +'<div class="wb-n">'+t.count+'</div><div class="wb-t">'+t.icon+' '+esc(t.name)+'</div>'
   +(t.hint?'<div class="wb-h">'+esc(t.hint)+'</div>':'')+'</div>').join('');
  const quick=(wb.quick||[]).map(q=>'<button class="btn btn-o btn-sm" style="margin:0 6px 6px 0" '
   +'onclick="openPage(\''+q.page+'\')" title="'+esc(q.hint||'')+'">'+q.icon+' '+esc(q.name)+'</button>').join('');
  box.innerHTML=info
   +'<div class="wb-grid">'+(cards||'<div class="wb-card wb-empty"><div class="wb-t">✅ 暂无待处理事项</div><div class="wb-h">有新的检验/不合格/客诉会出现在这里</div></div>')+'</div>'
   +(quick?'<div class="panel" style="margin-top:10px"><div style="font-size:12.5px;font-weight:600;margin-bottom:6px">🚀 我的常用业务（按岗位）</div>'+quick+'</div>':'');
}

if(!autoLogin())showLogin();
